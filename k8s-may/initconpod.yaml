apiVersion: v1
kind: Pod
metadata:
  name: mypod
spec:  
  containers:
    - name: my-app-con
      image: nginx:1.29
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
  initContainers:
    - name: init-container
      image: busybox
      command:
        - sh
        - -c
        - |
          echo "<h1>Hello from init container</h1> > /usr/share/nginx/html/index.html"
      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html-volume
      emptyDir: {}