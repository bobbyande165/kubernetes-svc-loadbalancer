apiVersion: v1
kind: Pod
metadata:
  name: myownpod1
spec:
  containers:
    - name: my-app-con
      image: nginx:1.29
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
  initContainers:
    - name: my-init-con
      image: busybox
      command:
        - sh
        - -c
        - |
          echo "<h1>iam from init con</h1>"  > /usr/share/nginx/html/index.html
      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html-volume
      emptyDir: {}